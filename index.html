    const c=d.customers.find(x=>x.id===id); if(!c)return;
    const b=bal(id), tx=d.tx.filter(x=>x.cid===id)
      .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
    const over=b>c.limit;

    profileBody.innerHTML=`
      <div class="row">
        <div class="profile">
          <div class="avatar">${esc(c.name[0]||'C')}</div>
          <div><div class="pname">${esc(c.name)}</div>
          <div class="meta">📱 ${esc(c.phone||'')}<br>🚛 ${esc(c.vehicle||'')}</div></div>
        </div>
        <button class="ghost" onclick="toggleMenu()">⋮</button>
      </div>

      <div class="limits">
        <div class="limit"><small>Outstanding</small><strong class="red">${money(b)}</strong></div>
        <div class="limit"><small>Credit Limit</small><strong>${money(c.limit)}</strong></div>
        <div class="limit"><small>Available</small><strong class="green">${money(c.limit-b)}</strong></div>
      </div>

      <div class="card"><span class="status ${over?'over':'safe'}">${over?'🔴 Over Limit':'🟢 Within Limit'}</span></div>

      <div class="tiles">
        <button class="tile" onclick="sale('${id}')"><b>⛽</b>Fuel Sale</button>
        <button class="tile" onclick="payment('${id}')"><b>💳</b>Payment</button>
        <button class="tile" onclick="ledger('${id}')"><b>📒</b>Ledger</button>
        <button class="tile" onclick="statement('${id}')"><b>📄</b>Statement</button>
      </div>

      <div class="card">
        <div class="row"><b>Recent Activity</b><button class="ghost" onclick="ledger('${id}')">View All</button></div>
        ${tx.slice(0,6).map(t=>mini(t)).join('')||'<div class="empty">No transactions.</div>'}
      </div>

      <div id="pmenu" class="menu">
        <button onclick="editC('${id}')">✏️ Edit Customer</button>
        <button onclick="alert('Payment reminder prepared')">🔔 Payment Reminder</button>
        <button class="del" onclick="delC('${id}')">🗑️ Delete Customer</button>
      </div>`;
  };

  /* Recent Activity transaction row — clickable and opens Edit/Delete. */
  window.mini=function(t){
    return `<div class="tx" onclick="detail('${t.id}')">
      <div class="date">${fmt(t.date)}</div>
      <div class="part">${t.type==='sale'?'⛽ '+esc(t.fuel)+' '+t.qty+' L':'💳 Payment ('+esc(t.mode)+')'}</div>
      <div class="${t.type==='sale'?'debit':'credit'}">${t.type==='sale'?money(t.amount):'-'+money(t.amount)}</div>
    </div>`;
  };

  /* Ledger = transaction history only. NO statement and NO summary. */
  window.ledger=function(id){
    const c=d.customers.find(x=>x.id===id); if(!c)return;
    const tx=d.tx.filter(t=>t.cid===id)
      .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));

    modalBody.innerHTML=`
      <h2>📒 Ledger — ${esc(c.name)}</h2>
      <div class="card">
        ${tx.map(t=>mini(t)).join('')||'<div class="empty">No transactions.</div>'}
      </div>
      <div class="actions">
        <button class="ghost" onclick="closeM();profile('${id}')">← Back to Customer</button>
      </div>`;
    openM();
  };

  /* Read-only transaction row for statements. */
  function statementRow(t){
    return `<div class="tx" style="cursor:default">
      <div class="date">${fmt(t.date)}</div>
      <div class="part">${t.type==='sale'?'⛽ '+esc(t.fuel)+' '+t.qty+' L':'💳 Payment ('+esc(t.mode)+')'}</div>
      <div class="${t.type==='sale'?'debit':'credit'}">${t.type==='sale'?money(t.amount):'-'+money(t.amount)}</div>
    </div>`;
  }

  window.statement=function(cid){
    const c=d.customers.find(x=>x.id===cid); if(!c)return;
    const today=new Date();
    const week=new Date(today); week.setDate(today.getDate()-6);
    const from7=week.toISOString().slice(0,10), to=today.toISOString().slice(0,10);

    modalBody.innerHTML=`
      <h2>📄 Customer Statement</h2>
      <div class="statement-note"><b>${esc(c.name)}</b><br>Read-only statement. Choose the period you need.</div>

      <div class="statement-quick">
        <button onclick="statementToday('${cid}')">Today</button>
        <button onclick="statementWeek('${cid}')">This Week</button>
        <button onclick="statementMonth('${cid}')">This Month</button>
        <button onclick="statementCustom('${cid}')">Custom Range</button>
      </div>

      <div id="statementDates" class="form statement-range" style="display:none">
        <label>From Date<input id="statementFrom" type="date" value="${from7}"></label>
        <label>To Date<input id="statementTo" type="date" value="${to}"></label>
      </div>

      <div id="statementPeriod" class="statement-note">Select a period above.</div>

      <div id="statementResult"></div>

      <div class="actions">
        <button class="primary" onclick="generateStatement('${cid}')">View Statement</button>
        <button class="ghost" onclick="closeM();profile('${cid}')">← Back</button>
      </div>`;
    openM();
  };

  window.statementToday=function(cid){
    const d0=new Date().toISOString().slice(0,10);
    showStatementDates(d0,d0,'Today');
    generateStatement(cid);
  };
  window.statementWeek=function(cid){
    const now=new Date(), day=now.getDay(), diff=day===0?6:day-1;
    const mon=new Date(now); mon.setDate(now.getDate()-diff);
    const from=mon.toISOString().slice(0,10),to=now.toISOString().slice(0,10);
    showStatementDates(from,to,'This Week');
    generateStatement(cid);
  };
  window.statementMonth=function(cid){
    const now=new Date(),from=new Date(now.getFullYear(),now.getMonth(),1)
      .toISOString().slice(0,10),to=now.toISOString().slice(0,10);
    showStatementDates(from,to,'This Month');
    generateStatement(cid);
  };
  window.statementCustom=function(cid){
    const now=new Date(),to=now.toISOString().slice(0,10);
    const from=new Date(now);from.setDate(now.getDate()-6);
    showStatementDates(from.toISOString().slice(0,10),to,'Custom Range');
    document.getElementById('statementResult').innerHTML='';
  };
  function showStatementDates(from,to,label){
    document.getElementById('statementDates').style.display='grid';
    document.getElementById('statementFrom').value=from;
    document.getElementById('statementTo').value=to;
    document.getElementById('statementPeriod').innerHTML='<b>Selected period:</b> '+label;
  }

  window.generateStatement=function(cid){
    const from=document.getElementById('statementFrom')?.value;
    const to=document.getElementById('statementTo')?.value;
    if(!from||!to){
      document.getElementById('statementDates').style.display='grid';
      return alert('Please select From Date and To Date.');
    }
    if(from>to)return alert('From Date cannot be after To Date.');

    const all=d.tx.filter(t=>t.cid===cid)
      .sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
    const before=all.filter(t=>t.date<from);
    const period=all.filter(t=>t.date>=from&&t.date<=to);
    const opening=before.reduce((a,t)=>a+(t.type==='sale'?+t.amount:-+t.amount),0);
    const sales=period.filter(t=>t.type==='sale').reduce((a,t)=>a+ +t.amount,0);
    const payments=period.filter(t=>t.type==='payment').reduce((a,t)=>a+ +t.amount,0);
    const closing=opening+sales-payments;

    document.getElementById('statementResult').innerHTML=`
      <div class="card statement-readonly">
        <div class="summary">
          <div class="sum"><small>Opening Balance</small><strong>${money(opening)}</strong></div>
          <div class="sum"><small>Fuel Sales</small><strong>${money(sales)}</strong></div>
          <div class="sum"><small>Payments</small><strong class="green">${money(payments)}</strong></div>
        </div>
        <div class="sum" style="margin-top:8px"><small>Closing Balance</small><strong class="red">${money(closing)}</strong></div>
      </div>
      <div class="card statement-readonly">
        ${period.map(statementRow).join('')||'<div class="empty">No transactions in this period.</div>'}
      </div>
      <div class="actions">
        <button class="ghost" onclick="printStatementPeriod('${cid}')">🖨 Print / PDF</button>
        <button class="ghost" onclick="shareStatement('${cid}')">📤 Share</button>
      </div>`;
  };

  window.printStatementPeriod=function(cid){
    const from=document.getElementById('statementFrom')?.value,to=document.getElementById('statementTo')?.value;
    if(!from||!to)return alert('Select the statement period first.');
    const c=d.customers.find(x=>x.id===cid);
    const all=d.tx.filter(t=>t.cid===cid).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
    const before=all.filter(t=>t.date<from),period=all.filter(t=>t.date>=from&&t.date<=to);
    const opening=before.reduce((a,t)=>a+(t.type==='sale'?+t.amount:-+t.amount),0);
    const sales=period.filter(t=>t.type==='sale').reduce((a,t)=>a+ +t.amount,0);
    const payments=period.filter(t=>t.type==='payment').reduce((a,t)=>a+ +t.amount,0);
    const closing=opening+sales-payments;
    const w=window.open('','_blank');if(!w)return;
    w.document.write(`<html><head><title>Customer Statement</title><style>body{font-family:Arial;padding:28px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body>
      <h2>Khori Filling Station</h2><h3>${esc(c.name)} — Customer Statement</h3>
      <p>${from} to ${to}</p>
      <table><tr><th>Date</th><th>Particular</th><th>Amount</th></tr>
      ${period.map(t=>`<tr><td>${t.date}</td><td>${t.type==='sale'?esc(t.fuel)+' '+t.qty+' L':'Payment ('+esc(t.mode)+')'}</td><td>${money(t.amount)}</td></tr>`).join('')}</table>
      <p>Opening Balance: <b>${money(opening)}</b></p><p>Fuel Sales: <b>${money(sales)}</b></p><p>Payments: <b>${money(payments)}</b></p><h3>Closing Balance: ${money(closing)}</h3>
      </body></html>`);
    w.document.close();w.print();
  };

  window.shareStatement=function(cid){
    const from=document.getElementById('statementFrom')?.value,to=document.getElementById('statementTo')?.value;
    const c=d.customers.find(x=>x.id===cid);
    const text=`${c.name} — Customer Statement\n${from} to ${to}\nOutstanding: ${money(bal(cid))}`;
    if(navigator.share) navigator.share({title:'Customer Statement',text});
    else if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>alert('Statement summary copied.'));
    else alert(text);
  };

  /* Re-apply front layer whenever modal content changes. */
  const observer=new MutationObserver(()=>{const m=document.getElementById('modal');if(m&&m.classList.contains('open')){m.style.zIndex='2147483000';}});
  observer.observe(document.body,{childList:true,subtree:true});
})();
</script>

</body></html>

<!doctype html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PumpOS Demo</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>html,body,#root{margin:0;min-height:100%;background:#12140F}*{box-sizing:border-box}button,input{font-family:inherit}body{overflow-x:hidden}</style>
</head><body><div id="root"></div><script type="text/babel">
const {useState}=React;
const {Check,AlertTriangle,ChevronLeft,User,LayoutDashboard,ClipboardList,Truck,Tag,Users,TrendingUp,Wallet,MessageSquare}=lucide;
// ---- Design tokens ----
const C = {
  bg: "#12140F",
  panel: "#1B1E16",
  panel2: "#22261B",
  amber: "#F5A623",
  amberDim: "#8A5E14",
  green: "#4B7B3F",
  red: "#C0503A",
  text: "#F4F1E8",
  textDim: "#9A9A88",
  line: "#33362A",
};

const STAFF = [
  { id: "s1", name: "Ramesh" },
  { id: "s2", name: "Suresh" },
  { id: "s3", name: "Anita" },
];

const PRICE_PETROL = 96.72;
const PRICE_DIESEL = 89.62;

function BigNumberEntry({ label, unit, value, onChange, autoFocus }) {
  return (
    <div style={{ marginBottom: 28 }}>
      <div style={{ color: C.textDim, fontSize: 15, marginBottom: 10, letterSpacing: 0.3 }}>{label}</div>
      <div style={{ display: "flex", alignItems: "baseline", borderBottom: `2px solid ${C.amberDim}`, paddingBottom: 8 }}>
        <input autoFocus={autoFocus} inputMode="decimal" value={value}
          onChange={(e) => onChange(e.target.value.replace(/[^0-9.]/g, ""))}
          placeholder="0"
          style={{ fontFamily: "'JetBrains Mono', monospace", fontVariantNumeric: "tabular-nums", fontSize: 44, fontWeight: 600, background: "transparent", border: "none", outline: "none", color: C.text, width: "100%" }}
        />
        {unit && <span style={{ color: C.textDim, fontSize: 20, marginLeft: 8 }}>{unit}</span>}
      </div>
    </div>
  );
}

function StepShell({ title, step, total, onBack, children }) {
  return (
    <div style={{ padding: "28px 24px 100px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        {onBack ? <button onClick={onBack} style={{ background: "none", border: "none", color: C.textDim, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", padding: 0 }}><ChevronLeft size={20} /> <span style={{ fontSize: 14 }}>Back</span></button> : <div />}
        <div style={{ color: C.textDim, fontSize: 13, fontFamily: "monospace" }}>{step} / {total}</div>
      </div>
      <div style={{ display: "flex", gap: 4, marginBottom: 32 }}>
        {Array.from({ length: total }).map((_, i) => <div key={i} style={{ height: 3, flex: 1, background: i < step ? C.amber : C.line, borderRadius: 2 }} />)}
      </div>
      <h1 style={{ fontSize: 26, fontWeight: 700, color: C.text, marginBottom: 28, letterSpacing: -0.3 }}>{title}</h1>
      {children}
    </div>
  );
}

function BottomButton({ label, onClick, disabled }) {
  return <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, padding: 16, background: `linear-gradient(180deg, transparent, ${C.bg} 30%)` }}>
    <button onClick={onClick} disabled={disabled} style={{ width: "100%", padding: "18px 0", fontSize: 18, fontWeight: 700, borderRadius: 12, border: "none", background: disabled ? C.line : C.amber, color: disabled ? C.textDim : "#1B1E16", cursor: disabled ? "not-allowed" : "pointer", letterSpacing: 0.2 }}>{label}</button>
  </div>;
}

function Row({ label, value, bold }) {
  return <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", color: bold ? C.text : C.textDim, fontWeight: bold ? 700 : 400 }}><span>{label}</span><span style={{ fontFamily: "monospace" }}>{value}</span></div>;
}

function StatCard({ label, value, accent, sub }) {
  return <div style={{ flex: 1, background: C.panel, borderRadius: 12, padding: 16 }}>
    <div style={{ color: C.textDim, fontSize: 12, marginBottom: 6 }}>{label}</div>
    <div style={{ fontSize: 26, fontWeight: 700, color: accent || C.text, fontFamily: "monospace" }}>{value}</div>
    {sub && <div style={{ color: C.textDim, fontSize: 11, marginTop: 4 }}>{sub}</div>}
  </div>;
}

function SectionHeader({ icon: Icon, title }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, marginTop: 30 }}>
    <Icon size={18} color={C.amber} /><h2 style={{ fontSize: 16, fontWeight: 700, color: C.text }}>{title}</h2>
  </div>;
}

const ROLES = [
  { id: "staff", label: "STAFF" },
  { id: "manager", label: "MANAGER" },
  { id: "owner", label: "OWNER" },
];

function App() {
  const [view, setView] = useState("staff");
  const [step, setStep] = useState(0);
  const [staffId, setStaffId] = useState(null);
  const [petrolOpen, setPetrolOpen] = useState("");
  const [petrolClose, setPetrolClose] = useState("");
  const [dieselOpen, setDieselOpen] = useState("");
  const [dieselClose, setDieselClose] = useState("");
  const [cash, setCash] = useState("");
  const [digital, setDigital] = useState("");
  const [credit, setCredit] = useState("");
  const [creditName, setCreditName] = useState("");
  const [done, setDone] = useState(false);

  const [log, setLog] = useState([
    { id: 1, staff: "Ramesh", date: "Aug 24", diff: 0, note: null },
    { id: 2, staff: "Suresh", date: "Aug 24", diff: -420, note: null },
    { id: 3, staff: "Anita", date: "Aug 23", diff: 0, note: null },
    { id: 4, staff: "Ramesh", date: "Aug 23", diff: 15, note: "Change given wrong to customer, corrected next shift" },
    { id: 5, staff: "Suresh", date: "Aug 22", diff: -60, note: null },
  ]);

  const [credits, setCredits] = useState([
    { name: "Verma Transport", amount: 8400, days: 22 },
    { name: "Local Taxi Union", amount: 3200, days: 6 },
    { name: "Gupta Traders", amount: 15600, days: 41 },
  ]);
  const [stockLogOpen, setStockLogOpen] = useState(false);
  const [petrolPrice] = useState(PRICE_PETROL);
  const [dieselPrice] = useState(PRICE_DIESEL);
  const [noteDraft, setNoteDraft] = useState({});

  const petrolSold = Math.max(0, (parseFloat(petrolClose) || 0) - (parseFloat(petrolOpen) || 0));
  const dieselSold = Math.max(0, (parseFloat(dieselClose) || 0) - (parseFloat(dieselOpen) || 0));
  const fuelRevenue = petrolSold * petrolPrice + dieselSold * dieselPrice;
  const expectedCash = fuelRevenue - (parseFloat(digital) || 0) - (parseFloat(credit) || 0);
  const actualCash = parseFloat(cash) || 0;
  const diff = Math.round(actualCash - expectedCash);
  const matched = Math.abs(diff) <= 5;

  const steps = ["who", "openMeter", "closeMeter", "cash", "digital", "creditQ", "result"];
  const next = () => setStep((s) => Math.min(s + 1, steps.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));

  function finish() {
    setLog((l) => [{ id: Date.now(), staff: STAFF.find((s) => s.id === staffId)?.name, date: "Today", diff, note: null }, ...l]);
    if (parseFloat(credit) > 0 && creditName) setCredits((c) => [{ name: creditName, amount: parseFloat(credit), days: 0 }, ...c]);
    setDone(true);
  }
  function reset() {
    setStep(0); setStaffId(null); setPetrolOpen(""); setPetrolClose(""); setDieselOpen(""); setDieselClose("");
    setCash(""); setDigital(""); setCredit(""); setCreditName(""); setDone(false);
  }
  const current = steps[step];
  function resolveFlag(id) {
    setLog((l) => l.map((entry) => entry.id === id ? { ...entry, note: noteDraft[id] || "Resolved" } : entry));
  }

  const totalRevenueEstimate = log.length * 9200;
  const totalMismatchAmount = log.reduce((sum, l) => sum + Math.abs(l.diff), 0);
  const totalCreditExposure = credits.reduce((sum, c) => sum + c.amount, 0);
  const overdueCredit = credits.filter((c) => c.days > 30);
  const staffPatterns = STAFF.map((s) => {
    const entries = log.filter((l) => l.staff === s.name);
    return { name: s.name, mismatches: entries.filter((l) => l.diff !== 0).length, shifts: entries.length };
  });

  return <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'Inter', system-ui, sans-serif" }}>
    <div style={{ display: "flex", borderBottom: `1px solid ${C.line}` }}>
      {ROLES.map((r) => <button key={r.id} onClick={() => setView(r.id)} style={{ flex: 1, padding: "12px 0", background: "none", border: "none", color: view === r.id ? C.amber : C.textDim, fontWeight: 600, fontSize: 13, cursor: "pointer", borderBottom: view === r.id ? `2px solid ${C.amber}` : "2px solid transparent" }}>{r.label}</button>)}
    </div>

    {view === "staff" && !done && <>
      {current === "who" && <StepShell title="Who is closing this shift?" step={1} total={7}>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>{STAFF.map((s) =>
          <button key={s.id} onClick={() => { setStaffId(s.id); next(); }} style={{ display: "flex", alignItems: "center", gap: 14, padding: "18px 16px", borderRadius: 12, border: `1px solid ${staffId === s.id ? C.amber : C.line}`, background: C.panel, color: C.text, fontSize: 18, fontWeight: 600, cursor: "pointer", textAlign: "left" }}>
            <div style={{ width: 40, height: 40, borderRadius: "50%", background: C.amberDim, display: "flex", alignItems: "center", justifyContent: "center" }}><User size={20} color={C.text} /></div>{s.name}
          </button>)}</div>
      </StepShell>}

      {current === "openMeter" && <StepShell title="Meter readings — start of shift" step={2} total={7} onBack={back}>
        <BigNumberEntry label="Petrol nozzle — opening reading" unit="L" value={petrolOpen} onChange={setPetrolOpen} autoFocus />
        <BigNumberEntry label="Diesel nozzle — opening reading" unit="L" value={dieselOpen} onChange={setDieselOpen} />
        <BottomButton label="Next" onClick={next} disabled={!petrolOpen || !dieselOpen} />
      </StepShell>}

      {current === "closeMeter" && <StepShell title="Meter readings — end of shift" step={3} total={7} onBack={back}>
        <BigNumberEntry label="Petrol nozzle — closing reading" unit="L" value={petrolClose} onChange={setPetrolClose} autoFocus />
        <BigNumberEntry label="Diesel nozzle — closing reading" unit="L" value={dieselClose} onChange={setDieselClose} />
        {(petrolClose || dieselClose) && <div style={{ background: C.panel2, borderRadius: 10, padding: "14px 16px", color: C.amber, fontSize: 15, fontFamily: "monospace" }}>Fuel sold: {petrolSold.toFixed(1)}L Petrol · {dieselSold.toFixed(1)}L Diesel</div>}
        <div style={{ height: 20 }} /><BottomButton label="Next" onClick={next} disabled={!petrolClose || !dieselClose} />
      </StepShell>}

      {current === "cash" && <StepShell title="Cash counted" step={4} total={7} onBack={back}>
        <BigNumberEntry label="Count the cash in hand" unit="₹" value={cash} onChange={setCash} autoFocus /><BottomButton label="Next" onClick={next} disabled={!cash} />
      </StepShell>}

      {current === "digital" && <StepShell title="Card / UPI total" step={5} total={7} onBack={back}>
        <BigNumberEntry label="Total card + UPI payments" unit="₹" value={digital} onChange={setDigital} autoFocus /><BottomButton label="Next" onClick={next} />
      </StepShell>}

      {current === "creditQ" && <StepShell title="Credit given today" step={6} total={7} onBack={back}>
        <BigNumberEntry label="Total credit amount (0 if none)" unit="₹" value={credit} onChange={setCredit} autoFocus />
        {credit && parseFloat(credit) > 0 && <div style={{ marginBottom: 20 }}>
          <div style={{ color: C.textDim, fontSize: 15, marginBottom: 10 }}>Customer name</div>
          <input value={creditName} onChange={(e) => setCreditName(e.target.value)} placeholder="Type name" style={{ width: "100%", boxSizing: "border-box", fontSize: 20, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "14px 16px", color: C.text, outline: "none" }} />
        </div>}
        <BottomButton label="See result" onClick={() => { next(); finish(); }} />
      </StepShell>}
    </>}

    {view === "staff" && done && current === "result" && <div style={{ padding: "48px 24px", textAlign: "center" }}>
      <div style={{ width: 100, height: 100, borderRadius: "50%", margin: "0 auto 24px", background: matched ? "rgba(75,123,63,0.15)" : "rgba(192,80,58,0.15)", display: "flex", alignItems: "center", justifyContent: "center", border: `3px solid ${matched ? C.green : C.red}` }}>
        {matched ? <Check size={44} color={C.green} /> : <AlertTriangle size={44} color={C.red} />}
      </div>
      <h1 style={{ fontSize: 26, fontWeight: 700, color: C.text, marginBottom: 8 }}>{matched ? "All matched" : "Amount mismatch"}</h1>
      <p style={{ color: C.textDim, fontSize: 15, marginBottom: 32 }}>{matched ? "Cash counted matches expected sales." : `Cash is ${diff < 0 ? "short" : "over"} by ₹${Math.abs(diff)}`}</p>
      <div style={{ background: C.panel, borderRadius: 14, padding: 20, textAlign: "left", fontSize: 14, color: C.textDim, marginBottom: 32 }}>
        <Row label="Fuel revenue" value={`₹${fuelRevenue.toFixed(0)}`} /><Row label="Card / UPI" value={`− ₹${digital || 0}`} /><Row label="Credit given" value={`− ₹${credit || 0}`} />
        <div style={{ borderTop: `1px solid ${C.line}`, margin: "10px 0" }} />
        <Row label="Expected cash" value={`₹${expectedCash.toFixed(0)}`} bold /><Row label="Cash counted" value={`₹${actualCash.toFixed(0)}`} bold />
      </div>
      <button onClick={reset} style={{ background: C.amber, border: "none", borderRadius: 12, padding: "16px 32px", fontWeight: 700, fontSize: 16, color: "#1B1E16", cursor: "pointer" }}>Start next shift</button>
    </div>}

    {view === "manager" && <div style={{ padding: "28px 24px 60px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}><ClipboardList size={22} color={C.amber} /><h1 style={{ fontSize: 22, fontWeight: 700, color: C.text }}>Today at this pump</h1></div>
      <p style={{ color: C.textDim, fontSize: 13, marginBottom: 20 }}>Same-day operations — resolve, log, update.</p>
      <div style={{ display: "flex", gap: 12, marginBottom: 10 }}><StatCard label="Shifts today" value={log.filter(l => l.date === "Today" || l.date === "Aug 24").length} /><StatCard label="Unresolved flags" value={log.filter(l => l.diff !== 0 && !l.note).length} accent={C.red} /></div>

      <SectionHeader icon={ClipboardList} title="Shift log — resolve flags" />
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{log.map((l) => <div key={l.id} style={{ background: C.panel, borderRadius: 12, padding: "14px 16px", border: `1px solid ${l.diff === 0 ? C.line : C.red}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}><div style={{ width: 36, height: 36, borderRadius: "50%", background: C.amberDim, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, color: C.text }}>{l.staff?.[0]}</div><div><div style={{ color: C.text, fontWeight: 600, fontSize: 15 }}>{l.staff}</div><div style={{ color: C.textDim, fontSize: 12 }}>{l.date}</div></div></div>
          <div style={{ color: l.diff === 0 ? C.green : C.red, fontWeight: 700, fontFamily: "monospace" }}>{l.diff === 0 ? "Matched" : `₹${Math.abs(l.diff)} ${l.diff < 0 ? "short" : "over"}`}</div>
        </div>
        {l.diff !== 0 && <div style={{ marginTop: 10 }}>{l.note ? <div style={{ display: "flex", gap: 8, alignItems: "flex-start", color: C.textDim, fontSize: 13 }}><MessageSquare size={14} style={{ marginTop: 2, flexShrink: 0 }} /><span>{l.note}</span></div> : <div style={{ display: "flex", gap: 8 }}><input value={noteDraft[l.id] || ""} onChange={(e) => setNoteDraft((d) => ({ ...d, [l.id]: e.target.value }))} placeholder="Add a note (why the mismatch?)" style={{ flex: 1, background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 8, padding: "8px 10px", color: C.text, fontSize: 13, outline: "none" }} /><button onClick={() => resolveFlag(l.id)} style={{ background: C.amber, border: "none", borderRadius: 8, padding: "8px 14px", fontWeight: 700, fontSize: 13, color: "#1B1E16", cursor: "pointer" }}>Resolve</button></div>}</div>}
      </div>)}</div>

      <SectionHeader icon={Users} title="Credit customers" />
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{credits.map((c, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.panel, borderRadius: 10, padding: "12px 16px" }}><div><div style={{ color: C.text, fontSize: 14, fontWeight: 600 }}>{c.name}</div><div style={{ color: c.days > 30 ? C.red : C.textDim, fontSize: 12 }}>{c.days === 0 ? "Added today" : `${c.days} days outstanding`}</div></div><div style={{ color: C.amber, fontFamily: "monospace", fontWeight: 700 }}>₹{c.amount.toLocaleString()}</div></div>)}</div>

      <SectionHeader icon={Truck} title="Tanker delivery" />
      <button onClick={() => setStockLogOpen(v => !v)} style={{ width: "100%", background: C.panel, border: `1px dashed ${C.line}`, borderRadius: 10, padding: "14px 16px", color: C.textDim, fontSize: 14, cursor: "pointer", textAlign: "left" }}>{stockLogOpen ? "Delivery entry form (demo — not wired up)" : "+ Log new fuel delivery"}</button>

      <SectionHeader icon={Tag} title="Fuel prices" />
      <div style={{ display: "flex", gap: 12 }}><div style={{ flex: 1, background: C.panel, borderRadius: 10, padding: "12px 16px" }}><div style={{ color: C.textDim, fontSize: 12, marginBottom: 4 }}>Petrol</div><div style={{ color: C.text, fontFamily: "monospace", fontSize: 18, fontWeight: 700 }}>₹{petrolPrice}</div></div><div style={{ flex: 1, background: C.panel, borderRadius: 10, padding: "12px 16px" }}><div style={{ color: C.textDim, fontSize: 12, marginBottom: 4 }}>Diesel</div><div style={{ color: C.text, fontFamily: "monospace", fontSize: 18, fontWeight: 700 }}>₹{dieselPrice}</div></div></div>
      <div style={{ color: C.textDim, fontSize: 12, marginTop: 8 }}>Manager updates these when the price changes — staff entries use whatever is set here.</div>
    </div>}

    {view === "owner" && <div style={{ padding: "28px 24px 60px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}><LayoutDashboard size={22} color={C.amber} /><h1 style={{ fontSize: 22, fontWeight: 700, color: C.text }}>Business overview</h1></div>
      <p style={{ color: C.textDim, fontSize: 13, marginBottom: 20 }}>Trends, money, and risk — not day-to-day operations.</p>
      <div style={{ display: "flex", gap: 12, marginBottom: 10 }}><StatCard label="Est. revenue (period)" value={`₹${totalRevenueEstimate.toLocaleString()}`} /><StatCard label="Total mismatch (period)" value={`₹${totalMismatchAmount}`} accent={totalMismatchAmount > 0 ? C.red : C.green} /></div>
      <div style={{ display: "flex", gap: 12, marginBottom: 20 }}><StatCard label="Credit exposure" value={`₹${totalCreditExposure.toLocaleString()}`} sub={`${credits.length} customers`} /><StatCard label="Overdue 30+ days" value={overdueCredit.length} accent={overdueCredit.length ? C.red : C.green} sub={`₹${overdueCredit.reduce((s, c) => s + c.amount, 0).toLocaleString()}`} /></div>
      <SectionHeader icon={TrendingUp} title="Staff pattern — where to look closer" />
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{staffPatterns.map((s, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.panel, borderRadius: 10, padding: "12px 16px" }}><div style={{ color: C.text, fontSize: 14, fontWeight: 600 }}>{s.name}</div><div style={{ fontSize: 13, color: s.mismatches > 1 ? C.red : C.textDim }}>{s.mismatches} mismatch{s.mismatches !== 1 ? "es" : ""} / {s.shifts} shifts</div></div>)}</div>
      <SectionHeader icon={Wallet} title="Credit exposure — aging" />
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>{[...credits].sort((a,b) => b.days-a.days).map((c, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.panel, borderRadius: 10, padding: "12px 16px", border: c.days > 30 ? `1px solid ${C.red}` : `1px solid ${C.line}` }}><div style={{ color: C.text, fontSize: 14, fontWeight: 600 }}>{c.name}</div><div style={{ display: "flex", gap: 14, alignItems: "center" }}><span style={{ color: c.days > 30 ? C.red : C.textDim, fontSize: 12 }}>{c.days}d</span><span style={{ color: C.amber, fontFamily: "monospace", fontWeight: 700 }}>₹{c.amount.toLocaleString()}</span></div></div>)}</div>
      <div style={{ marginTop: 24, padding: "14px 16px", background: C.panel2, borderRadius: 10, color: C.textDim, fontSize: 12 }}>Multi-pump comparison will appear here once more than one pump is connected.</div>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

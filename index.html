<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PumpOS — First Day Prototype</title>
<style>
:root{--bg:#12140F;--panel:#1B1E16;--panel2:#22261B;--amber:#F5A623;--green:#4B7B3F;--red:#C0503A;--text:#F4F1E8;--muted:#9A9A88;--line:#33362A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:5;background:rgba(18,20,15,.98);border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}.brand b{font-size:19px}.tag{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 8px}
.tabs{display:flex}.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:12px 5px;font-size:12px;font-weight:800}.tabs button.active{color:var(--amber);border-color:var(--amber)}
.wrap{max-width:760px;margin:auto;padding:26px 18px 90px}.title{font-size:25px;margin:0 0 6px}.sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat label{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stat strong{font:700 25px ui-monospace,monospace}
.choice{width:100%;display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:16px;margin-bottom:10px;text-align:left}.avatar{width:40px;height:40px;border-radius:50%;background:#8A5E14;display:grid;place-items:center;font-weight:800}
.field{display:block;color:var(--muted);font-size:13px;margin:17px 0 7px}input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:13px;outline:none}input:focus{border-color:#8A5E14}.big input{font:700 34px ui-monospace,monospace;background:transparent;border:0;border-bottom:2px solid #8A5E14;border-radius:0;padding:8px 0}
.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:9px;margin-top:20px}.btn{flex:1;border-radius:10px;padding:14px 15px;font-weight:800;border:0}.primary{background:var(--amber);color:#1B1E16}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:rgba(192,80,58,.12);border:1px solid var(--red);color:#ef9b89}
.progress{display:flex;gap:4px;margin:15px 0 28px}.progress i{height:3px;flex:1;border-radius:3px;background:var(--line)}.progress i.on{background:var(--amber)}
.notice{margin-top:13px;padding:13px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px}.green{color:#9bcf8d}.red{color:#ef9b89}.amber{color:var(--amber)}
.section{margin-top:28px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:16px;margin:0}.row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}.rowline{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{text-align:center;color:var(--muted);padding:28px;background:var(--panel);border-radius:11px}.result{text-align:center}.circle{width:90px;height:90px;margin:25px auto 18px;border-radius:50%;display:grid;place-items:center;font-size:40px;border:3px solid var(--green);color:var(--green);background:rgba(75,123,63,.12)}.circle.bad{border-color:var(--red);color:#ef9b89;background:rgba(192,80,58,.12)}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const S={view:"staff",step:0,staff:"",openP:"",openD:"",closeP:"",closeD:"",cash:"",digital:"",credit:"",creditName:"",shifts:[],credits:[],deliveries:[],prices:{petrol:0,diesel:0}};
const staff=["Ramesh","Suresh","Anita"];
function money(n){return "₹"+Math.round(n||0).toLocaleString("en-IN")}
function sold(){return {p:Math.max(0,(+S.closeP||0)-(+S.openP||0)),d:Math.max(0,(+S.closeD||0)-(+S.openD||0))}}
function revenue(){let x=sold();return x.p*S.prices.petrol+x.d*S.prices.diesel}
function expected(){return revenue()-(+S.digital||0)-(+S.credit||0)}
function difference(){return Math.round((+S.cash||0)-expected())}
function save(){localStorage.setItem("pumpos-first-day",JSON.stringify({shifts:S.shifts,credits:S.credits,deliveries:S.deliveries,prices:S.prices}))}
function clearSaved(){localStorage.removeItem("pumpos-first-day")}
function resetAll(){clearSaved();S.step=0;S.staff="";S.openP="";S.openD="";S.closeP="";S.closeD="";S.cash="";S.digital="";S.credit="";S.creditName="";S.shifts=[];S.credits=[];S.deliveries=[];S.prices={petrol:0,diesel:0};render()}
function app(){
return `<div class="app"><header class="top"><div class="brand"><b>⛽ PumpOS</b><span class="tag">FIRST DAY · EMPTY</span></div><div class="tabs">
${["staff","manager","owner"].map(v=>`<button class="${S.view===v?"active":""}" onclick="view('${v}')">${v.toUpperCase()}</button>`).join("")}</div></header>${S.view==="staff"?staff():S.view==="manager"?manager():owner()}</div>`
}
function staff(){
if(S.step===7)return result();
let titles=["Who is closing this shift?","Opening meter readings","Closing meter readings","Cash counted","Card / UPI total","Credit given today","Review & submit"];
let body=[who(),open(),close(),cash(),digital(),credit(),review()][S.step];
return `<main class="wrap"><h1 class="title">${titles[S.step]}</h1><p class="sub">Fresh installation · no previous data</p><div class="progress">${titles.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("")}</div>${body}</main>`
}
function who(){return staff.map(n=>`<button class="choice" onclick="choose('${n}')"><span class="avatar">${n[0]}</span><span><b>${n}</b><br><span class="muted">Start shift closing</span></span></button>`).join("")}
function big(label,key,unit){return `<label class="field">${label}</label><div class="big"><input value="${S[key]}" inputmode="decimal" placeholder="0" oninput="S.${key}=this.value"></div><div class="muted">${unit}</div>`}
function nav(dis=false){return `<div class="actions"><button class="btn secondary" onclick="back()">Back</button><button class="btn primary" onclick="next()" ${dis?"disabled":""}>Next</button></div>`}
function open(){return `<div class="card">${big("Petrol opening meter","openP","litres")}${big("Diesel opening meter","openD","litres")}${nav(!S.openP||!S.openD)}</div>`}
function close(){let x=sold();return `<div class="card">${big("Petrol closing meter","closeP","litres")}${big("Diesel closing meter","closeD","litres")}<div class="notice amber">Sold: ${x.p.toFixed(1)} L petrol · ${x.d.toFixed(1)} L diesel</div>${nav(!S.closeP||!S.closeD)}</div>`}
function cash(){return `<div class="card">${big("Cash counted in hand","cash","₹")}<div class="notice">Expected cash: <b>${money(expected())}</b><br>Difference: <b class="${Math.abs(difference())<=5?"green":"red"}">${difference()>=0?"+":""}${money(difference())}</b></div>${nav(!S.cash)}</div>`}
function digital(){return `<div class="card">${big("Total card + UPI","digital","₹")}${nav()}</div>`}
function credit(){return `<div class="card">${big("Credit given today","credit","₹")}${+S.credit>0?`<label class="field">Customer name</label><input value="${S.creditName}" placeholder="Customer / company" oninput="S.creditName=this.value">`:""}${nav()}</div>`}
function review(){let x=sold(),d=difference();return `<div class="card"><b>${S.staff}</b><div class="section">${[
["Petrol sold",x.p.toFixed(1)+" L"],["Diesel sold",x.d.toFixed(1)+" L"],["Fuel revenue",money(revenue())],["Card / UPI",money(+S.digital||0)],["Credit",money(+S.credit||0)],["Expected cash",money(expected())],["Cash counted",money(+S.cash||0)],["Difference",(d>=0?"+":"-")+money(Math.abs(d))]
].map(a=>`<div class="rowline" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="muted">${a[0]}</span><b class="${a[0]==="Difference"?(Math.abs(d)<=5?"green":"red"):""}">${a[1]}</b></div>`).join("")}</div><div class="actions"><button class="btn secondary" onclick="back()">Back</button><button class="btn primary" onclick="submit()">Submit shift</button></div></div>`}
function result(){let d=difference(),ok=Math.abs(d)<=5;return `<main class="wrap result"><div class="circle ${ok?"":"bad"}">${ok?"✓":"!"}</div><h1 class="title">${ok?"Shift matched":"Mismatch flagged"}</h1><p class="sub">${ok?"This first-day shift is balanced.":"This shift needs manager review."}</p><div class="card" style="text-align:left"><div class="rowline"><span class="muted">Staff</span><b>${S.staff}</b></div><div class="rowline"><span class="muted">Expected cash</span><b>${money(expected())}</b></div><div class="rowline"><span class="muted">Cash counted</span><b>${money(+S.cash)}</b></div><div class="rowline"><span class="muted">Difference</span><b class="${ok?"green":"red"}">${d>=0?"+":""}${money(d)}</b></div></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="newShift()">Start next shift</button></main>`}
function manager(){return `<main class="wrap"><h1 class="title">Today at this pump</h1><p class="sub">Day 1 · clean operational dashboard</p><div class="grid">${stat("Shifts",S.shifts.length)}${stat("Open flags",S.shifts.filter(x=>x.status==="flagged").length)}${stat("Credit",money(S.credits.reduce((a,x)=>a+x.amount,0)))}${stat("Deliveries",S.deliveries.length)}</div><div class="section"><div class="sectionhead"><h2>Shift log</h2></div>${S.shifts.length?S.shifts.map(x=>`<div class="row"><div class="rowline"><b>${x.staff}</b><span class="${x.status==="matched"?"green":"red"}">${x.status==="matched"?"MATCHED":money(Math.abs(x.diff))+" SHORT/OVER"}</span></div><div class="muted">${x.date}</div></div>`).join(""):`<div class="empty">No shifts yet. The pump is ready for its first shift.</div>`}</div><div class="section"><h2>Credit ledger</h2>${S.credits.length?S.credits.map(x=>`<div class="row rowline"><b>${x.name}</b><span class="amber">${money(x.amount)}</span></div>`).join(""):`<div class="empty">₹0 · No credit customers.</div>`}</div><div class="section"><h2>Fuel prices</h2><div class="grid"><div class="card"><span class="muted">Petrol</span><br><b>${money(S.prices.petrol)}/L</b></div><div class="card"><span class="muted">Diesel</span><br><b>${money(S.prices.diesel)}/L</b></div></div></div><div class="section"><button class="btn danger" style="width:100%" onclick="resetAll()">Reset everything to Day 1</button></div></main>`}
function owner(){let m=S.shifts.reduce((a,x)=>a+Math.abs(x.diff||0),0),c=S.credits.reduce((a,x)=>a+x.amount,0);return `<main class="wrap"><h1 class="title">Business overview</h1><p class="sub">Day 1 · no historical data</p><div class="grid">${stat("Revenue",money(0))}${stat("Mismatch",money(m))}${stat("Credit",money(c))}${stat("Shifts",S.shifts.length)}</div><div class="section">${S.shifts.length?`<div class="card">Historical analysis will populate after shifts are completed.</div>`:`<div class="empty">Nothing to analyse yet.<br><br>Start the first staff shift.</div>`}</div><div class="section"><button class="btn danger" style="width:100%" onclick="resetAll()">Reset everything to Day 1</button></div></main>`}
function stat(l,v){return `<div class="card stat"><label>${l}</label><strong>${v}</strong></div>`}
function view(v){S.view=v;render()}
function choose(n){S.staff=n;S.step=1;render()}
function next(){S.step++;render()}
function back(){S.step=Math.max(0,S.step-1);render()}
function submit(){let d=difference();S.shifts.unshift({id:Date.now(),staff:S.staff,date:"Today",diff:d,status:Math.abs(d)<=5?"matched":"flagged"});if(+S.credit>0&&S.creditName)S.credits.unshift({id:Date.now(),name:S.creditName,amount:+S.credit,days:0});save();S.step=7;render()}
function newShift(){Object.assign(S,{step:0,staff:"",openP:"",openD:"",closeP:"",closeD:"",cash:"",digital:"",credit:"",creditName:""});render()}
function render(){document.getElementById("root").innerHTML=app()}
render();
</script>
</body>
</html>
